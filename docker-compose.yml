services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    ports: ["8000:8000"]
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports: ["8501:8501"]
    depends_on: [api]
    restart: unless-stopped
